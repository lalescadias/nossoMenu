spring:
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nossomenu}
    username: ${DATABASE_USER:nossomenu}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: INFO
springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger
app:
  mail-from: ${MAIL_FROM:}
